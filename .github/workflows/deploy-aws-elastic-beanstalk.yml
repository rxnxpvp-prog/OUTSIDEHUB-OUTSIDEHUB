name: Deploy AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  APPLICATION_NAME: outsidehub
  ENVIRONMENT_NAME: outsidehub-prod
  PLATFORM_ARN: arn:aws:elasticbeanstalk:us-east-1::platform/Docker running on 64bit Amazon Linux 2023

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.APPLICATION_NAME }}
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          platform-arn: ${{ env.PLATFORM_ARN }}
          option-settings: |
            [
              {
                "Namespace": "aws:autoscaling:launchconfiguration",
                "OptionName": "IamInstanceProfile",
                "Value": "aws-elasticbeanstalk-ec2-role"
              },
              {
                "Namespace": "aws:elasticbeanstalk:environment",
                "OptionName": "ServiceRole",
                "Value": "aws-elasticbeanstalk-service-role"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "NODE_ENV",
                "Value": "production"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "PORT",
                "Value": "8080"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "DATA_DIR",
                "Value": "/app/data"
              },
              {
                "Namespace": "aws:elasticbeanstalk:environment:process:default",
                "OptionName": "HealthCheckPath",
                "Value": "/api/health"
              }
            ]
