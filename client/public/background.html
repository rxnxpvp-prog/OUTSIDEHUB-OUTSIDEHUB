<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OutsideHub Background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030304;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 58% at 50% 38%, rgba(255,255,255,0.055), transparent 54%),
      radial-gradient(ellipse 70% 46% at 50% 110%, rgba(255,255,255,0.05), transparent 62%),
      linear-gradient(180deg, #09090b 0%, #040405 46%, #010102 100%);
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(ellipse at 24% 22%, rgba(255,255,255,0.05), transparent 28%),
      radial-gradient(ellipse at 72% 34%, rgba(255,255,255,0.035), transparent 30%),
      radial-gradient(ellipse at 48% 74%, rgba(255,255,255,0.04), transparent 36%);
    filter: blur(80px);
    opacity: 0.75;
    animation: depthBreath 24s ease-in-out infinite alternate;
  }

  .canopy {
    position: absolute;
    inset: -8% -4% 0;
    opacity: 0.42;
    filter: blur(0.2px);
    background:
      linear-gradient(92deg, transparent 0 5%, rgba(255,255,255,0.055) 5.4% 5.8%, transparent 6.2% 12%),
      linear-gradient(86deg, transparent 0 13%, rgba(255,255,255,0.038) 13.2% 13.55%, transparent 13.9% 21%),
      linear-gradient(94deg, transparent 0 28%, rgba(255,255,255,0.045) 28.4% 28.8%, transparent 29.2% 36%),
      linear-gradient(88deg, transparent 0 43%, rgba(255,255,255,0.05) 43.2% 43.65%, transparent 44% 52%),
      linear-gradient(93deg, transparent 0 64%, rgba(255,255,255,0.04) 64.3% 64.65%, transparent 65% 73%),
      linear-gradient(87deg, transparent 0 84%, rgba(255,255,255,0.048) 84.2% 84.6%, transparent 85% 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 72%, transparent 100%);
  }

  .grid {
    position: absolute;
    left: -20%;
    right: -20%;
    bottom: -28%;
    height: 58%;
    opacity: 0.15;
    transform: perspective(820px) rotateX(62deg);
    transform-origin: center bottom;
    background-image:
      linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 72px 72px;
    animation: gridMove 24s linear infinite;
    mask-image: linear-gradient(to top, #000 0%, #000 50%, transparent 100%);
  }

  .fog,
  .fog::before,
  .fog::after {
    position: absolute;
    content: "";
    left: -30%;
    right: -30%;
    height: 36%;
    pointer-events: none;
    filter: blur(28px);
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.12), transparent 34%),
      radial-gradient(ellipse at 55% 55%, rgba(255,255,255,0.08), transparent 38%),
      radial-gradient(ellipse at 86% 45%, rgba(255,255,255,0.1), transparent 32%);
    opacity: 0.26;
  }

  .fog {
    bottom: 18%;
    animation: fogDrift 28s ease-in-out infinite alternate;
  }

  .fog::before {
    top: -92%;
    opacity: 0.42;
    animation: fogDriftReverse 34s ease-in-out infinite alternate;
  }

  .fog::after {
    top: 48%;
    opacity: 0.34;
    animation: fogDrift 40s ease-in-out infinite alternate;
  }

  .signal {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background:
      linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,0.06) 42%, transparent 47%),
      linear-gradient(245deg, transparent 0 52%, rgba(255,255,255,0.035) 56%, transparent 61%);
    animation: signalSweep 18s ease-in-out infinite alternate;
  }

  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.075;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    animation: grainShift 1.8s steps(2, end) infinite;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    opacity: 0.07;
    background: repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.035) 0,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 9px
    );
    mix-blend-mode: screen;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0.7;
  }

  @keyframes depthBreath {
    from { transform: translate3d(-1.5%, 1%, 0) scale(1); opacity: 0.58; }
    to { transform: translate3d(1.5%, -1%, 0) scale(1.08); opacity: 0.78; }
  }

  @keyframes gridMove {
    from { background-position: 0 0, 0 0; }
    to { background-position: 0 72px, 72px 0; }
  }

  @keyframes fogDrift {
    from { transform: translate3d(-4%, 0, 0) scale(1); }
    to { transform: translate3d(5%, -4%, 0) scale(1.08); }
  }

  @keyframes fogDriftReverse {
    from { transform: translate3d(5%, 2%, 0) scale(1.05); }
    to { transform: translate3d(-5%, -2%, 0) scale(1); }
  }

  @keyframes signalSweep {
    from { transform: translateX(-4%) scale(1); opacity: 0.16; }
    to { transform: translateX(4%) scale(1.04); opacity: 0.3; }
  }

  @keyframes grainShift {
    0% { transform: translate3d(0, 0, 0); }
    25% { transform: translate3d(-1%, 1%, 0); }
    50% { transform: translate3d(1%, -1%, 0); }
    75% { transform: translate3d(1%, 1%, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="embers"></canvas>
    <div class="canopy"></div>
    <div class="grid"></div>
    <div class="fog"></div>
    <div class="signal"></div>
    <div class="scanlines"></div>
    <div class="grain"></div>
  </div>

<script>
(function () {
  const canvas = document.getElementById("embers");
  const ctx = canvas.getContext("2d");
  let w = 0;
  let h = 0;
  let dpr = 1;
  let motes = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    init();
  }

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function init() {
    const count = Math.max(36, Math.round((w * h) / 42000));
    motes = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: rand(0.4, 1.6),
      vx: rand(-0.05, 0.05),
      vy: rand(-0.18, -0.04),
      a: rand(0.06, 0.18),
      phase: rand(0, Math.PI * 2),
    }));
  }

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of motes) {
      p.x += p.vx + Math.sin(t * 0.0002 + p.phase) * 0.035;
      p.y += p.vy;
      if (p.y < -8) {
        p.y = h + 8;
        p.x = Math.random() * w;
      }
      if (p.x < -8) p.x = w + 8;
      if (p.x > w + 8) p.x = -8;

      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 8);
      const flicker = 0.72 + Math.sin(t * 0.001 + p.phase) * 0.28;
      glow.addColorStop(0, `rgba(255,255,255,${p.a * flicker})`);
      glow.addColorStop(0.48, `rgba(255,255,255,${p.a * 0.24 * flicker})`);
      glow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 8, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
